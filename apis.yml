aid: theguarantors
name: TheGuarantors
description: 'TheGuarantors is a fintech company redefining access for renters and risk mitigation
  for multifamily owner-operators. Its products include a Lease Guarantee and Zero-Gap Renters
  Insurance: the Lease Guarantee helps renters get approved for a home even when they do not fit
  traditional landlord requirements, while giving owner-operators coverage against defaults, damages,
  vacancy, and no-shows, and Zero-Gap Renters Insurance combines a traditional HO4 policy with
  always-on digital compliance and a tenant liability waiver. TheGuarantors exposes a partner Lease
  Guarantee API that lets property management systems and screening providers embed the Lease
  Guarantee directly into rental application and leasing workflows, with programmatic coverage
  invitations, real-time status updates via API endpoints and webhooks, and rules-based engagement
  configuration. API documentation is hosted on Stoplight at docs.theguarantors.com and access is
  granted to integration partners.'
